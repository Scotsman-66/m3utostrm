name: Build and Host Versioned Container Image

on:
  workflow_dispatch: # Allows manual trigger
  push:
    tags:
      - 'v*'       # Automatically fires if you create a version tag in your fork

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Your Forked Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all tags for versioning

      - name: Extract Dynamic Version Tag
        id: meta
        run: |
          # If triggered manually, fall back to the raw version file or short commit SHA
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=stable-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Versioned Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
